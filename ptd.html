<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinterest To-Do</title>
  <style>
    :root {
      /* COLOUR PALETTE OVERRIDE - Radical Reports Style */
      --primary: #204d4f;      /* Deep Teal - Primary */
      --secondary: #426a6c;    /* Muted Teal - Secondary */
      --accent: #739395;       /* Sage Teal - Accent */
      --border-clr: #a9c1c2;   /* Soft Mint - Borders */
      --light-bg: #dbeeef;     /* Pale Mint - Background */
      
      --ink: #1e2b2c;
      --muted: #426a6c;
      --paper: #ffffff;
      --page-bg: var(--light-bg);
      --line: var(--border-clr);
      --shadow: 0 10px 30px rgba(32, 77, 79, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--page-bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .page-wrap {
      width: min(700px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 80px;
    }

    /* HEADER */
    .hero {
      text-align: left;
      margin-bottom: 20px;
      padding-bottom: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* NAVIGATION BUTTON */
    .nav-container {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border-clr);
      padding-bottom: 25px;
    }

    /* CARDS */
    .section-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .section-head {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 24px;
      background: #fcfdfe;
      border-bottom: 1px solid var(--line);
    }

    .step-number {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      background: var(--primary);
    }

    .section-head h2 {
      margin: 0;
      font-size: 20px;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .section-body { padding: 24px; }

    textarea {
      width: 100%;
      border: 1px solid var(--border-clr);
      background: #f9fbfc;
      border-radius: 12px;
      padding: 16px;
      font: inherit;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: all 0.2s ease;
      margin-bottom: 16px;
      min-height: 250px;
      line-height: 1.6;
      resize: none;
    }

    /* BUTTONS */
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; }

    button, .link-button {
      appearance: none;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .primary-btn { color: #fff; background: var(--primary); }
    .primary-btn:hover { background: var(--secondary); transform: translateY(-1px); }

    .copy-btn { color: #fff; background: var(--accent); }
    .copy-btn:hover { background: var(--secondary); }

    .toast {
      position: fixed;
      left: 50%; bottom: 30px; transform: translateX(-50%);
      background: var(--primary); color: #fff;
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      opacity: 0; transition: 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 12px;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <header class="hero">
      <h1>Pinterest To-Do</h1>
    </header>

    <div class="nav-container">
        <a href="https://sivahqpw.github.io/sr/srg.html" class="link-button primary-btn" target="_blank">My Tools</a>
    </div>

    <!-- TODO LIST CARD -->
    <section class="section-card">
      <div class="section-head">
        <div class="step-number">✓</div>
        <div>
          <h2>Workflow Prompt</h2>
          <p>The standard operating procedure for Pinterest business success.</p>
        </div>
      </div>
      <div class="section-body">
        <textarea id="todoPrompt" readonly>Select A Profitable Keyword (using country and VPN)
Know the demand 
Plan the Product
Create the product
Publish on Gumroad
Plan the Pin
Create the Pin
Publish on Pinterest</textarea>

        <div class="button-row">
          <button class="copy-btn" onclick="copyText()">Copy To-Do List</button>
        </div>
      </div>
    </section>

    <footer>
      Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
    </footer>
  </div>

  <div id="toast" class="toast">Copied to clipboard</div>

  <script>
    async function copyText() {
      const el = document.getElementById('todoPrompt');
      await navigator.clipboard.writeText(el.value);
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
