<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>COLOUR SCHEME OVERRIDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .header-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .header-link-btn:hover {
      background: var(--accent-primary);
      color: #020617;
      transform: translateY(-2px);
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .input-control {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 18px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Source Code Pro', monospace;
      font-size: 1rem;
      margin-bottom: 5px;
      outline: none;
      transition: all 0.3s;
      min-height: 100px;
      resize: vertical;
    }

    .input-control:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-word;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>COLOUR SCHEME OVERRIDE</h1>
      <a href="https://www.color-hex.com/color-palettes/" target="_blank" class="header-link-btn">
        Color Hex
      </a>
    </header>

    <div class="prompt-workflow">
      
      <!-- Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Configuration</span>
        </div>
        <label for="hexInput">HEX Colour Codes</label>
        <textarea id="hexInput" class="input-control" placeholder="#000000, #ffffff, etc." oninput="updatePrompt()"></textarea>
      </div>

      <!-- Result Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Final Prompt</span>
        </div>
        <div class="prompt-content" id="p1"></div>
        <button class="btn copy-btn" onclick="copyText('p1', this)">
          <span>Copy Prompt</span>
        </button>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const template = `COLOUR SCHEME OVERRIDE

This section overrides every previous colour-related instruction contained anywhere in this prompt.

Ignore any previously specified brand colours, palettes, gradients, accent colours, background colours, text colours, border colours, highlight colours, or colour examples.

From this point onward, use ONLY the colour palette provided below.

Colour Palette:

[Paste one or more HEX colour codes here.]

COLOUR ASSIGNMENT RULES

Do not use the colours randomly.

First, analyse the palette as a cohesive design system. Then intelligently assign each colour to the most appropriate visual role based on its hue, saturation, brightness, contrast, and overall harmony.

Determine suitable uses such as (where applicable):
- Primary brand colour
- Secondary colour
- Accent / Highlight colour
- Background colour
- Surface / Card colour
- Heading text colour
- Body text colour
- Border / Divider colour
- Icons
- Buttons / CTA
- Decorative elements
- Gradients

Choose assignments that maximise:
- Visual hierarchy
- Readability
- Accessibility
- Colour balance
- Contrast
- Professional appearance
- Premium visual aesthetics
- Consistency across the entire design

Do not force predefined roles if the palette naturally suggests a better arrangement.

If the palette contains only a few colours, intelligently reuse them where appropriate while maintaining visual harmony.

Do not introduce additional colours unless they are essential for realism (such as natural skin tones, realistic photographs, or objects that must retain their real-world colours).

Apply the resulting colour system consistently across every visual element while preserving all other instructions in the main prompt.`;

    function updatePrompt() {
      const hexValue = document.getElementById('hexInput').value || '[Paste one or more HEX colour codes here.]';
      const finalPrompt = template.replace('[Paste one or more HEX colour codes here.]', hexValue);
      document.getElementById('p1').innerText = finalPrompt;
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = updatePrompt;
  </script>
</body>
</html>
